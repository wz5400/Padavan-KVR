# 修改TNAME: 为你需要编译的型号，注意名称必须与 configs/templates/ 目录下真实的 .config 文件名一致
name: Build-Padavan-PSG1218_nano

on:
  workflow_dispatch:

jobs:
  build:
    # 建议优先用 ubuntu-22.04（Padavan 交叉工具链兼容性最稳）
    # 若 22.04 runner 在你账号上已下线，可改 ubuntu-24.04 并自行验证工具链
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@v4          # 原 @master 为反模式，固定版本

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        # 关键修复：jammy 已移除 Python2 的 python-docutils，必须写 python3-docutils
        # 否则整条 apt-get install 全部不执行（apt 只要有一个包名解析失败就整批中止）
        # libssl-dev 为补充项：编译 openssl/mbedtls 等组件常需要
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev \
        libssl-dev wget

    - name: Clone source code
      env:
        KERNEL: 3.4                       # 可改 4.4 对比内核差异；改内核需确认模板已支持
      run: |
        git clone --depth=1 https://github.com/fightroad/Padavan-KVR.git /opt/rt-n56u
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/

    - name: Build Firmware
      env:
        # 务必到 configs/templates/ 核对：必须存在 PSG1218_nano.config 这个文件，否则下方判断会 exit 1
        TNAME: PSG1218_nano
        KERNEL: 3.4
      run: |
        cd /opt/rt-n56u/trunk
        if [ ! -f configs/templates/$TNAME.config ] ; then
          echo "configs/templates/$TNAME.config not found"
          echo "可用模板列表："
          ls configs/templates/
          exit 1
        fi
        cp -f configs/templates/$TNAME.config .config

        ################################################################################################
        # 因不同型号配置功能不一样，先删除已有配置项；自己添加功能时也要先写上对应的删除语句，切记！
        ################################################################################################
        # sed -i '/CONFIG_FIRMWARE_INCLUDE_ZEROTIER/d' .config # 删除配置项 zerotier

        ######################################################################
        # 以下选项定义你需要的功能（y=集成, n=忽略），重新写入 .config
        ######################################################################
        # echo "CONFIG_FIRMWARE_INCLUDE_ZEROTIER=y" >> .config # zerotier ~1.3M

        #########################################################################################
        # 自定义添加其它功能请参考源码 configs/templates/ 下的 config 文件，按上面格式添加：
        # sed -i '/自定义项/d' .config
        # echo "自定义项=y" >> .config
        #########################################################################################
        sudo ./clear_tree
        sudo ./build_firmware_modify $TNAME 0
        sudo mv -f images/*.trx /opt/images/ || true

    - name: Upload packages
      uses: actions/upload-artifact@v4    # 原 @master 已被 GitHub 废弃，必须升到 v4
      if: always()
      with:
        name: Padavan-packages
        path: /opt/images
        if-no-files-found: warn
